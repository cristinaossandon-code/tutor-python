<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor Virtual de Python</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; }
    </style>
</head>
<body>
    <div id="root">
        <div style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
            <div style="text-align: center; color: white;">
                <h1 style="font-size: 2rem; margin-bottom: 1rem;">Cargando Tutor Virtual de Python...</h1>
                <div style="width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto;"></div>
            </div>
        </div>
        <style>
            @keyframes spin { to { transform: rotate(360deg); } }
        </style>
    </div>
    
    <script type="text/babel">
        const { useState } = React;

        function PythonTutor() {
            const [code, setCode] = useState('');
            const [analysis, setAnalysis] = useState(null);
            const [loading, setLoading] = useState(false);
            const [chatMessages, setChatMessages] = useState([]);
            const [chatInput, setChatInput] = useState('');
            const [chatLoading, setChatLoading] = useState(false);

            const analyzeCode = async () => {
                if (!code.trim()) {
                    alert('Por favor, ingresa código Python para analizar');
                    return;
                }

                setLoading(true);
                setAnalysis(null);

                try {
                    const response = await fetch('https://api.anthropic.com/v1/messages', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            model: 'claude-sonnet-4-20250514',
                            max_tokens: 1000,
                            messages: [{
                                role: 'user',
                                content: `Eres un tutor virtual de Python para estudiantes. Analiza este código y proporciona:
1. Si hay errores, identifícalos
2. Explica el tipo de error
3. Sugiere cómo corregirlo paso a paso
4. Muestra el código corregido
5. Incluye consejos de buenas prácticas

Código:
\`\`\`python
${code}
\`\`\`

Responde SOLO con JSON (sin markdown):
{"hasErrors": true, "errorType": "tipo", "explanation": "explicación", "steps": ["paso1"], "correctedCode": "código", "bestPractices": ["consejo1"]}`
                            }]
                        })
                    });

                    const data = await response.json();
                    const content = data.content[0].text.replace(/```json\n?|\n?```/g, '').trim();
                    const result = JSON.parse(content);
                    
                    setAnalysis(result);
                    setChatMessages([{ role: 'assistant', content: '¡Análisis completado! ¿Tienes preguntas?' }]);
                } catch (error) {
                    console.error('Error:', error);
                    alert('Error al analizar. Intenta de nuevo.');
                } finally {
                    setLoading(false);
                }
            };

            const sendChatMessage = async () => {
                if (!chatInput.trim() || !analysis) return;

                const userMessage = chatInput;
                setChatMessages(prev => [...prev, { role: 'user', content: userMessage }]);
                setChatInput('');
                setChatLoading(true);

                try {
                    const response = await fetch('https://api.anthropic.com/v1/messages', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            model: 'claude-sonnet-4-20250514',
                            max_tokens: 1000,
                            messages: [{
                                role: 'user',
                                content: `Tutor de Python. Código: ${code}. Análisis: ${JSON.stringify(analysis)}. Pregunta: ${userMessage}`
                            }]
                        })
                    });

                    const data = await response.json();
                    setChatMessages(prev => [...prev, { role: 'assistant', content: data.content[0].text }]);
                } catch (error) {
                    setChatMessages(prev => [...prev, { role: 'assistant', content: 'Error. Intenta de nuevo.' }]);
                } finally {
                    setChatLoading(false);
                }
            };

            return (
                <div style={{minHeight: '100vh', background: 'linear-gradient(to bottom right, #eff6ff, #e0e7ff)', padding: '24px'}}>
                    <div style={{maxWidth: '1280px', margin: '0 auto'}}>
                        {/* Header */}
                        <div style={{background: 'white', borderRadius: '8px', boxShadow: '0 4px 6px rgba(0,0,0,0.1)', padding: '24px', marginBottom: '24px'}}>
                            <h1 style={{fontSize: '30px', fontWeight: 'bold', color: '#1f2937', marginBottom: '8px'}}>🐍 Tutor Virtual de Python</h1>
                            <p style={{color: '#6b7280'}}>Aprende Python identificando y corrigiendo errores en tu código</p>
                        </div>

                        <div style={{display: 'grid', gridTemplateColumns: window.innerWidth >= 1024 ? '1fr 1fr' : '1fr', gap: '24px'}}>
                            {/* Editor */}
                            <div style={{background: 'white', borderRadius: '8px', boxShadow: '0 4px 6px rgba(0,0,0,0.1)', padding: '24px'}}>
                                <h2 style={{fontSize: '20px', fontWeight: '600', color: '#1f2937', marginBottom: '16px'}}>💻 Tu Código Python</h2>
                                <textarea
                                    value={code}
                                    onChange={(e) => setCode(e.target.value)}
                                    placeholder="Escribe tu código Python aquí...&#10;&#10;Ejemplo:&#10;def saludar(nombre)&#10;    print('Hola ' + nombre)"
                                    style={{width: '100%', height: '256px', padding: '16px', fontFamily: 'monospace', fontSize: '14px', border: '2px solid #d1d5db', borderRadius: '8px', resize: 'none', outline: 'none'}}
                                />
                                <button
                                    onClick={analyzeCode}
                                    disabled={loading}
                                    style={{width: '100%', marginTop: '16px', background: loading ? '#9ca3af' : '#4f46e5', color: 'white', fontWeight: '600', padding: '12px 24px', borderRadius: '8px', border: 'none', cursor: loading ? 'not-allowed' : 'pointer', transition: 'all 0.3s'}}
                                >
                                    {loading ? '⏳ Analizando...' : '🔍 Analizar Código'}
                                </button>
                            </div>

                            {/* Resultados */}
                            <div style={{background: 'white', borderRadius: '8px', boxShadow: '0 4px 6px rgba(0,0,0,0.1)', padding: '24px', maxHeight: '400px', overflowY: 'auto'}}>
                                <h2 style={{fontSize: '20px', fontWeight: '600', color: '#1f2937', marginBottom: '16px'}}>📊 Análisis y Correcciones</h2>
                                
                                {!analysis ? (
                                    <div style={{textAlign: 'center', color: '#9ca3af', padding: '48px 0'}}>
                                        <p style={{fontSize: '48px', marginBottom: '16px'}}>📝</p>
                                        <p>Ingresa tu código y presiona "Analizar Código"</p>
                                    </div>
                                ) : (
                                    <div style={{display: 'flex', flexDirection: 'column', gap: '16px'}}>
                                        {/* Estado */}
                                        <div style={{padding: '16px', borderRadius: '8px', background: analysis.hasErrors ? '#fef2f2' : '#f0fdf4', borderLeft: `4px solid ${analysis.hasErrors ? '#ef4444' : '#22c55e'}`}}>
                                            <div style={{fontWeight: '600', color: analysis.hasErrors ? '#991b1b' : '#166534', marginBottom: '8px'}}>
                                                {analysis.hasErrors ? '❌ Errores Encontrados' : '✅ ¡Código Correcto!'}
                                            </div>
                                            {analysis.errorType && (
                                                <p style={{fontSize: '14px', color: '#991b1b'}}>
                                                    Tipo: <code style={{background: '#fee2e2', padding: '2px 8px', borderRadius: '4px'}}>{analysis.errorType}</code>
                                                </p>
                                            )}
                                        </div>

                                        {/* Explicación */}
                                        <div style={{padding: '16px', borderRadius: '8px', background: '#eff6ff'}}>
                                            <h3 style={{fontWeight: '600', color: '#1e40af', marginBottom: '8px'}}>📝 Explicación</h3>
                                            <p style={{fontSize: '14px', color: '#1e3a8a'}}>{analysis.explanation}</p>
                                        </div>

                                        {/* Pasos */}
                                        {analysis.steps?.length > 0 && (
                                            <div style={{padding: '16px', borderRadius: '8px', background: '#fefce8'}}>
                                                <h3 style={{fontWeight: '600', color: '#854d0e', marginBottom: '8px'}}>🔧 Cómo Corregirlo</h3>
                                                <ol style={{paddingLeft: '20px', fontSize: '14px', color: '#854d0e'}}>
                                                    {analysis.steps.map((step, idx) => <li key={idx} style={{marginBottom: '4px'}}>{step}</li>)}
                                                </ol>
                                            </div>
                                        )}

                                        {/* Código corregido */}
                                        {analysis.correctedCode && (
                                            <div style={{padding: '16px', borderRadius: '8px', background: '#f9fafb'}}>
                                                <h3 style={{fontWeight: '600', color: '#1f2937', marginBottom: '8px'}}>✅ Código Corregido</h3>
                                                <pre style={{background: '#1f2937', color: '#4ade80', padding: '12px', borderRadius: '4px', fontSize: '12px', overflowX: 'auto'}}>
                                                    <code>{analysis.correctedCode}</code>
                                                </pre>
                                            </div>
                                        )}

                                        {/* Buenas prácticas */}
                                        {analysis.bestPractices?.length > 0 && (
                                            <div style={{padding: '16px', borderRadius: '8px', background: '#faf5ff'}}>
                                                <h3 style={{fontWeight: '600', color: '#6b21a8', marginBottom: '8px'}}>💡 Consejos de Buenas Prácticas</h3>
                                                <ul style={{paddingLeft: '20px', fontSize: '14px', color: '#6b21a8'}}>
                                                    {analysis.bestPractices.map((tip, idx) => <li key={idx} style={{marginBottom: '4px'}}>{tip}</li>)}
                                                </ul>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Chat */}
                        {analysis && (
                            <div style={{background: 'white', borderRadius: '8px', boxShadow: '0 4px 6px rgba(0,0,0,0.1)', padding: '24px', marginTop: '24px'}}>
                                <h2 style={{fontSize: '20px', fontWeight: '600', color: '#1f2937', marginBottom: '16px'}}>💬 Chat con tu Tutor</h2>
                                
                                <div style={{background: '#f9fafb', borderRadius: '8px', padding: '16px', height: '256px', overflowY: 'auto', marginBottom: '16px'}}>
                                    {chatMessages.length === 0 ? (
                                        <p style={{color: '#9ca3af', textAlign: 'center', paddingTop: '32px'}}>Haz una pregunta sobre tu código</p>
                                    ) : (
                                        <div style={{display: 'flex', flexDirection: 'column', gap: '12px'}}>
                                            {chatMessages.map((msg, idx) => (
                                                <div key={idx} style={{display: 'flex', justifyContent: msg.role === 'user' ? 'flex-end' : 'flex-start'}}>
                                                    <div style={{maxWidth: '80%', padding: '12px', borderRadius: '8px', background: msg.role === 'user' ? '#4f46e5' : 'white', color: msg.role === 'user' ? 'white' : '#1f2937', border: msg.role === 'user' ? 'none' : '2px solid #e5e7eb'}}>
                                                        <p style={{fontSize: '14px', whiteSpace: 'pre-wrap', margin: 0}}>{msg.content}</p>
                                                    </div>
                                                </div>
                                            ))}
                                            {chatLoading && (
                                                <div style={{display: 'flex', justifyContent: 'flex-start'}}>
                                                    <div style={{background: 'white', border: '2px solid #e5e7eb', padding: '12px', borderRadius: '8px'}}>
                                                        <div style={{display: 'flex', gap: '8px'}}>
                                                            <div style={{width: '8px', height: '8px', background: '#9ca3af', borderRadius: '50%', animation: 'bounce 1s infinite'}} />
                                                            <div style={{width: '8px', height: '8px', background: '#9ca3af', borderRadius: '50%', animation: 'bounce 1s infinite 0.15s'}} />
                                                            <div style={{width: '8px', height: '8px', background: '#9ca3af', borderRadius: '50%', animation: 'bounce 1s infinite 0.3s'}} />
                                                        </div>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>

                                <div style={{display: 'flex', gap: '8px'}}>
                                    <input
                                        type="text"
                                        value={chatInput}
                                        onChange={(e) => setChatInput(e.target.value)}
                                        onKeyPress={(e) => e.key === 'Enter' && sendChatMessage()}
                                        placeholder="Escribe tu pregunta aquí..."
                                        disabled={chatLoading}
                                        style={{flex: 1, padding: '12px', border: '2px solid #d1d5db', borderRadius: '8px', outline: 'none'}}
                                    />
                                    <button
                                        onClick={sendChatMessage}
                                        disabled={chatLoading || !chatInput.trim()}
                                        style={{background: (chatLoading || !chatInput.trim()) ? '#9ca3af' : '#4f46e5', color: 'white', padding: '12px 24px', borderRadius: '8px', border: 'none', cursor: (chatLoading || !chatInput.trim()) ? 'not-allowed' : 'pointer', fontWeight: '600'}}
                                    >
                                        📤 Enviar
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                    <style>{`@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }`}</style>
                </div>
            );
        }

        ReactDOM.render(<PythonTutor />, document.getElementById('root'));
    </script>
</body>
</html>
